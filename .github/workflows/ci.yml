# Vets and tests on Linux, and proves the window starts there by drawing one
# frame on a virtual display (the PNG is kept as an artifact). macOS is checked
# locally for now: GitHub's macOS runners queue for a long time.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install the window's Linux libraries
        run: ./scripts/linux-deps.sh

      - name: Vet
        run: go vet -tags x11 ./...
      - name: Test
        run: go test -tags x11 ./...

      - name: Draw a frame of the window on a virtual display
        run: |
          go build -tags x11 -o diskscan-ui ./cmd/diskscan-ui
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x800x24" \
            ./diskscan-ui -capture window-linux.png /usr/share
          test -s window-linux.png
      - name: Keep the frame
        uses: actions/upload-artifact@v7
        with:
          name: window-linux
          path: window-linux.png
