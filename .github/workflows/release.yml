# On a version tag (v1.2.3), runs CI, builds the Linux archives natively on an
# amd64 and an arm64 runner (the web version and the window, which is checked
# by drawing a frame) and publishes them with checksums as a GitHub release.
# The macOS archives are built locally with scripts/release.sh for now.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  linux:
    needs: ci
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/linux-deps.sh

      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o diskscan .
          go build -tags x11 -trimpath -ldflags="-s -w" -o diskscan-ui ./cmd/diskscan-ui
      - name: Check the window draws
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x800x24" \
            ./diskscan-ui -capture frame.png /usr/share
          test -s frame.png
      - name: Pack
        run: |
          mkdir -p dist
          tar -czf "dist/diskscan-$GITHUB_REF_NAME-linux-${{ matrix.arch }}.tar.gz" diskscan
          tar -czf "dist/diskscan-ui-$GITHUB_REF_NAME-linux-${{ matrix.arch }}.tar.gz" diskscan-ui
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  publish:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz > checksums.txt && cat checksums.txt
      - name: Create the release, or update its files if it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --title "diskscan $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md --generate-notes
          fi
